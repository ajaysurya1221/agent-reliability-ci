name: agent-reliability-ci
description: Gate a pull request on a frozen, repeated-trial experiment comparing a candidate agent with its baseline.
branding:
  icon: shield
  color: blue

inputs:
  manifest:
    description: Path to the sealed experiment manifest (JSON).
    required: true
  out:
    description: Directory for the run store.
    required: false
    default: arci-runs
  workers:
    description: Parallel trials.
    required: false
    default: "4"
  allow-inconclusive:
    description: Treat INCONCLUSIVE (exit 2) as a passing check. BLOCK and ERROR always fail.
    required: false
    default: "false"
  pr-comment:
    description: "Post/update one sticky PR summary. Requires pull-requests: write; forks without write access skip softly. Serialize runs for one PR with a concurrency group, e.g. ${{ github.workflow }}-${{ github.event.pull_request.number }}, cancel-in-progress: false. Racing duplicates are refreshed on the next run; none are deleted."
    required: false
    default: "false"

  comment-id:
    description: "Optional sticky-comment identity; defaults to workflow name + job + manifest path. Use distinct ids for independent experiments."
    required: false
    default: ""

outputs:
  verdict:
    description: PASS, BLOCK, INCONCLUSIVE or ERROR.
    value: ${{ steps.gate.outputs.verdict || steps.comment_gate.outputs.verdict }}

runs:
  using: composite
  steps:
    - name: Install arci
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "${{ github.action_path }}"
    - name: Run the frozen experiment and gate
      id: gate
      if: ${{ inputs.pr-comment != 'true' }}
      shell: bash
      env:
        ARCI_MANIFEST: ${{ inputs.manifest }}
        ARCI_OUT: ${{ inputs.out }}
        ARCI_WORKERS: ${{ inputs.workers }}
        ARCI_ALLOW_INCONCLUSIVE: ${{ inputs.allow-inconclusive }}
      run: |
        set +e
        arci run "$ARCI_MANIFEST" --out "$ARCI_OUT" --workers "$ARCI_WORKERS" | tee arci-report.md
        code=${PIPESTATUS[0]}
        set -e
        cat arci-report.md >> "$GITHUB_STEP_SUMMARY"
        case "$code" in
          0) verdict=PASS ;;
          1) verdict=BLOCK ;;
          2) verdict=INCONCLUSIVE ;;
          *) verdict=ERROR ;;
        esac
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        if [ "$code" = "2" ] && [ "$ARCI_ALLOW_INCONCLUSIVE" = "true" ]; then exit 0; fi
        exit "$code"
    - name: Run the frozen experiment and gate
      id: comment_gate
      if: ${{ inputs.pr-comment == 'true' }}
      shell: bash
      env:
        ARCI_MANIFEST: ${{ inputs.manifest }}
        ARCI_OUT: ${{ inputs.out }}
        ARCI_WORKERS: ${{ inputs.workers }}
        ARCI_ALLOW_INCONCLUSIVE: ${{ inputs.allow-inconclusive }}
      run: |
        set +e
        arci run "$ARCI_MANIFEST" --out "$ARCI_OUT" --workers "$ARCI_WORKERS" 2> >(tee arci-run.stderr >&2) | tee arci-report.md
        code=${PIPESTATUS[0]}
        set -e
        cat arci-report.md >> "$GITHUB_STEP_SUMMARY"
        case "$code" in
          0) verdict=PASS ;;
          1) verdict=BLOCK ;;
          2) verdict=INCONCLUSIVE ;;
          *) verdict=ERROR ;;
        esac
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        if [ "$code" = "2" ] && [ "$ARCI_ALLOW_INCONCLUSIVE" = "true" ]; then exit 0; fi
        exit "$code"
    - name: Prepare offline HTML report
      id: report
      if: ${{ always() && inputs.pr-comment == 'true' && steps.comment_gate.outcome != 'skipped' }}
      continue-on-error: true
      shell: bash
      env:
        ARCI_ACTION_PATH: ${{ github.action_path }}
      run: python "$ARCI_ACTION_PATH/.github/scripts/prepare_report.py"
    - name: Upload HTML report
      id: artifact
      if: ${{ always() && inputs.pr-comment == 'true' && steps.report.outputs.report_dir != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.report.outputs.artifact_name }}
        path: ${{ steps.report.outputs.report_dir }}/report.html
        if-no-files-found: error
    - name: Update pull request comment
      if: ${{ always() && inputs.pr-comment == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ARCI_VERDICT: ${{ steps.comment_gate.outputs.verdict }}
        ARCI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        ARCI_MANIFEST: ${{ inputs.manifest }}
        ARCI_COMMENT_ID: ${{ inputs.comment-id }}
        ARCI_SUMMARY: ${{ steps.report.outputs.report_dir }}/summary.md
        ARCI_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        ARCI_ACTION_PATH: ${{ github.action_path }}
      run: python "$ARCI_ACTION_PATH/.github/scripts/pr_comment.py"
