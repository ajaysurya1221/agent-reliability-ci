<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="762" viewBox="0 0 1600 762" role="img" aria-labelledby="title desc">
<title id="title">Agents that use a decision model</title>
<desc id="desc">Agents that use a decision model. TypeSafe's Jev answers typed questions with calibrated probabilities. arci tests what the agent does with those answers, with zero agent changes. Agent process: Any SDK, unchanged. It reads two environment variables the harness sets: the endpoint is a loopback port, the key is a per-trial token. The two variables are TYPESAFE_BASE_URL and TYPESAFE_API_KEY. An arrow to the harness-owned boundary: Serves the MCP tools and the decision endpoint. Every request and answer is recorded as a tool call, budgeted, and perturbed on schedule. Injected decision faults: decision_low_confidence and decision_unavailable. An arrow to the upstream: fixture: seeded answers, offline, runs in CI. http: the real API or a gateway, key held by the harness, model pinned, trial starts paced. Sealed records: The answer the agent saw and the raw upstream answer, side by side. Never the key. An arrow to the same commands: gate: the same exact intervals; a model's confidence never enters a verdict; replay: serves the recording; no provider needed; preflight: key, endpoint, pinned model, one smoke request; report: recorded decisions, tokens, estimated cost.</desc>
