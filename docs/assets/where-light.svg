<text x="64" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#16211D" font-weight="600">Where arci sits</text>
<text x="64" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#3E3D38">Between an agent change and the merge decision: a frozen, repeated experiment, and diagnosis from the same records.</text>
