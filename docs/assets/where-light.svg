<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">Where arci sits in a CI pipeline</title>
<desc id="desc">Where arci sits. Between an agent change and the merge decision: a frozen, repeated experiment, and diagnosis from the same records. Before the run: Frozen manifest (baseline and candidate, oracle, faults, seeds, N and the decision rule). In CI: Recorded trials (seeded trials per arm, injected tool faults, sealed boundary records), then arci gate (exact Clopper-Pearson bounds on the difference, frozen margin), verdict PASS · BLOCK · INCONCLUSIVE · ERROR, exit 0 · 1 · 2 · 3. Merge decision: merge on PASS (exit 0); BLOCK and ERROR fail the job; INCONCLUSIVE fails by default. A separate branch from the recorded trials: Trace comparison (first divergent step, passing vs failing trial); then Fault reduction (ddmin over injected faults, same fingerprint); then Offline replay (recorded boundary calls, not fresh model inference). Diagnosis does not need a BLOCK: it compares any passing and failing trial in the records. Replay re-serves the recorded boundary calls; it does not repeat model inference.</desc>
