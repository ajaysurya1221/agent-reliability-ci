<text x="572" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#3E3D38" text-anchor="middle">seeded trials per arm,</text>
<text x="572" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#3E3D38" text-anchor="middle">injected tool faults,</text>
