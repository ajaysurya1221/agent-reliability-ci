[project]
name = "realornoise"
version = "2.4.0"
description = "Did your coding agent get worse? Reads the Claude Code and Codex session logs on your disk and answers real drop, no drop or cannot tell. Sends nothing."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["agent-reliability-ci==2.4.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/ajaysurya1221/agent-reliability-ci"
Source = "https://github.com/ajaysurya1221/agent-reliability-ci"
Issues = "https://github.com/ajaysurya1221/agent-reliability-ci/issues"

[project.scripts]
realornoise = "arci.logs.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realornoise"]

[tool.hatch.build.targets.sdist]
only-include = ["src/realornoise", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]
