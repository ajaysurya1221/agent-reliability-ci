name: CodeQL

# Static analysis of the Python source and of the workflow (Actions) definitions themselves.
# Runs on pushes to main and sprint branches, on every pull request, and once a week so that
# new CodeQL query packs see the existing code even when nothing changed.

on:
  push:
    branches:
      - main
      - "sprint/**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "19 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
      # Python is interpreted: CodeQL's extractor reads the source directly, so there is no
      # build step to run between init and analyze.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
