name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"

jobs:
  check:
    name: check / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Verify lock and sync environment
        run: |
          uv lock --check
          uv sync --frozen
      - name: Set up Node
        if: matrix.python-version == '3.14'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/jev_triage_agent/package-lock.json
      - name: Install the JavaScript SDK example
        if: matrix.python-version == '3.14'
        run: npm ci --prefix examples/jev_triage_agent
      - name: Frozen files unchanged
        run: shasum -a 256 -c FROZEN.sha256
      - name: Check formatting
        run: .venv/bin/ruff format --check .
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Type check
        run: .venv/bin/basedpyright
      - name: Tests
        env:
          PYTEST_ADDOPTS: >-
            --basetemp="${{ runner.temp }}/pytest" -o tmp_path_retention_policy=failed
        run: |
          cat > "$RUNNER_TEMP/test_p7_artifact_probe.py" <<'PROBE'
          from arci.gate import decide
          from arci.runner import run_experiment
          from tests.acceptance.helpers import COND_CLEAN, manifest

          def test_p7_probe(tmp_path):
              m = manifest(n_per_arm=1, conditions=(COND_CLEAN,), oracle="raising_oracle")
              trials = run_experiment(m, tmp_path, max_workers=1)
              decision = decide(m, trials)
              (tmp_path / m.experiment_id / "decision.json").write_text(decision.model_dump_json())
              assert False, "P7 intentional artifact probe"
          PROBE
          PYTHONPATH="$GITHUB_WORKSPACE" .venv/bin/pytest -c pyproject.toml -p no:cacheprovider "$RUNNER_TEMP/test_p7_artifact_probe.py"

      - name: Upload failed pytest stores
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-${{ github.job }}-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pytest/**/trials.jsonl
            ${{ runner.temp }}/pytest/**/events.jsonl
            ${{ runner.temp }}/pytest/**/manifest.json
            ${{ runner.temp }}/pytest/**/decision.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

  stats-macos:
    name: stats re-derivation / macOS / Python ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Verify lock and sync environment
        run: |
          uv lock --check
          uv sync --frozen
      - name: Statistics and committed-store re-derivation tests
        run: |
          .venv/bin/pytest -p no:cacheprovider \
            tests/unit/stats \
            tests/unit/examples/test_guardrail_results.py
