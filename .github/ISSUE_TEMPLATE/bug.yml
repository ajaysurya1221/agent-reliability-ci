name: Bug report
description: Something in arci (or realornoise) behaved unexpectedly.
title: "bug: "
labels:
  - bug
body:
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      placeholder: "arci run --manifest manifest.json"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: agent-reliability-ci / realornoise version, or the commit if run from source.
      placeholder: "2.3.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.1"
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Output, error message or incorrect result. For arci logs or realornoise, paste only the tool's own printed output, never a log line or a log file path (see CONTRIBUTING.md).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I pasted no log line and no file path.
          required: true
