name: Session log format changed
description: arci logs / realornoise no longer reads a client's session logs correctly.
title: "logs: "
labels:
  - logs
body:
  - type: markdown
    attributes:
      value: |
        Before filing this, check `docs/LOG_FORMATS.md` for the client versions the readers
        were already checked against. Paste only the tool's own printed output below, never
        a log line or a log file path. See `CONTRIBUTING.md` for the privacy rule.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Claude Code
        - Codex
    validations:
      required: true
  - type: input
    id: client-version
    attributes:
      label: Client version
      description: The coding agent's own version (for example Claude Code 2.1.325, Codex CLI 0.167.0).
      placeholder: "2.1.325"
    validations:
      required: true
  - type: input
    id: tool-version
    attributes:
      label: realornoise (or agent-reliability-ci) version
      placeholder: "2.3.0"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Pasted output of the run
      description: The full text `arci logs` or `realornoise` printed, or the JSON/Markdown/HTML report it wrote. Not a log line, not a log file path.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I pasted no log line and no file path.
          required: true
