[project]
name = "agent-reliability-ci"
version = "0.3.0"
description = "Regression testing for stochastic AI agents: frozen experiments, fault injection, replayable reduced failures."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "basedpyright>=1.37,<2",
  "pytest>=8,<10",
  "ruff>=0.14,<1",
  "types-pyyaml>=6",
]

[project.scripts]
arci = "arci.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arci"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "acceptance: immutable acceptance tests owned by the orchestrator",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Explicit, so import sorting does not depend on what happens to be on disk.
known-first-party = ["arci", "tests", "examples", "bench"]

[tool.basedpyright]
include = ["src", "tests", "bench", "examples"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportMissingModuleSource = false
