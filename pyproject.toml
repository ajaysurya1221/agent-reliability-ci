[project]
name = "agent-reliability-ci"
version = "0.8.0"
description = "Regression testing for stochastic AI agents: frozen experiments, fault injection, replayable reduced failures."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = ["ai-agents", "reliability", "fault-injection", "statistics", "evaluation", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "basedpyright>=1.37,<2",
  "pytest>=8,<10",
  "ruff>=0.14,<1",
  "types-pyyaml>=6",
  # Only for tests/acceptance/test_decisions_sdk.py: the official SDK against the boundary.
  "typesafe-sdk>=0.7,<1",
]

[project.urls]
Homepage = "https://github.com/ajaysurya1221/agent-reliability-ci"
Source = "https://github.com/ajaysurya1221/agent-reliability-ci"
Changelog = "https://github.com/ajaysurya1221/agent-reliability-ci/blob/main/CHANGELOG.md"
Issues = "https://github.com/ajaysurya1221/agent-reliability-ci/issues"
"Design records" = "https://github.com/ajaysurya1221/agent-reliability-ci/tree/main/docs/design"

[project.scripts]
arci = "arci.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arci"]

[tool.hatch.build.targets.sdist]
only-include = ["src/arci", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "acceptance: immutable acceptance tests owned by the orchestrator",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Explicit, so import sorting does not depend on what happens to be on disk.
known-first-party = ["arci", "tests", "examples", "bench"]

[tool.basedpyright]
include = ["src", "tests", "bench", "examples"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportMissingModuleSource = false
